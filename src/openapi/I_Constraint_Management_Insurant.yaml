  # version 1.5.1
  #   - renamed all occurrences of state MAINTENANCE to INACCESSIBLE
  # version 1.5.0
  #   - constraints of category "technical" or of documents of category "technical" will be rejected
  # version 1.4.0
  #   - added status- and error code for state MAINTENANCE
  # version 1.3.1
  #   - clarification about condition for 404 noHealthRecord and 409 statusMismatch
  # version 1.3.0
  #   - optional X-Request-ID in all requests and responses
  # version 1.2.3
  #   - additional error condition for missing device registration 
  # version 1.2.2
  #   - clarification regarding required entitlement for logging
  #   - added error condition for not authenticated user sessions
  # version 1.2.1
  #   - editorial correction of rootDocumentId explanation and format
  # version 1.2.0
  #   - removed paging from getDenyPolicyAssignments
  #   - updated list of relevant oids (editorial)
  # version 1.1.4
  #   - added childsrecord category
  # version 1.1.3
  #   - bugfix UserAgentType
  # version 1.1.2
  #   - changed http-statuscode in description of operation setDenyPolicyAssignment to 201
  # version 1.1.1
