servers:
  - url: https://epa-hst1.prod.epa4all.de

tags:
  - name: ConstraintManagement
    description: |
      Constraint Management allow to configure the general deny policiy of a health record by 
      setting or deleting constraints (assignments of the deny policy).</br>
      An assignment may be related to a single document, a folder or a category. Any document affected
      by an assigment will be hidden to any user of the deny policy affected user roles.</br>
      
      The assignments of the deny policies hide documents for the XDS Document Service only. Assignments 
      related to folders or categories hide all contained documents (not the folder / category)

      **Allowed user groups/ roles**:</br> 
      The general deny policy affects the following user groups (roles) for each assignment.
      The following list of oids is for information only and may be incomplete, the normative 
      requirement is defined in A_24306-*
      - oid_praxis_arzt
      - oid_krankenhaus
      - oid_institution-vorsorge-reha
      - oid_zahnarztpraxis
      - oid_öffentliche_apotheke
      - oid_praxis_psychotherapeut
      - oid_institution-pflege
      - oid_institution-geburtshilfe
      - oid_praxis-physiotherapeut
      - oid_institution-oegd
      - oid_institution-arbeitsmedizin
      - oid_diga
      - oid_praxis-ergotherapeut
      - oid_praxis-logopaede
      - oid_praxis-podologe
      - oid_praxis-ernaehrungstherapeut

      **Restricted categories and folders**:</br>
      Some categories/folders of a health record may contain MIOs or structured documents represented by more 
      than one XDS document (document collections, e.g. category _vaccination_). Hiding single documents 
      of such MIOs or structured documents would take the contained information out of context. This should 
      be avoided, thus hiding single documents is not supported in this case.</br>
      The following list shows categories with this restriction and is for information only and 
      may be incomplete. The normative requirement to avoid hiding of single documents applies
      for any folder with type = "uniform" or "mixed" (see 
      src/implementation_guides on GitHub/gematik/api-epa).
      
      - dental
      - child
      - pregnancy_childbirth
      - vaccination

      **Exceptions**
      The category "emp" can not be hidden by assignments of the general deny policy. 
      The participation in the electronic medical process is managed by consent decisions only. 
      This applies also for single documents of this category.
      
      **Remarks**:</br>
      - Assignments for the General Deny Policy may also be applied internally
      by the XDS document service after evaluation of confidentialityCode metadata 
      in a document provide operation.
      - Assignments of the policies are deleted internally in case a referenced _document_
      or folder is deleted from the document management.

paths:
  /epa/xds-document/api/v1/constraints:
    parameters:
      - $ref: '#/components/parameters/insurantid'
      - $ref: '#/components/parameters/useragent'
      - $ref: '#/components/parameters/requestid'
    get:
      tags:
        - ConstraintManagement
      operationId: getDenyPolicyAssignments
      summary: (getDenyPolicyAssignments) get a list of actual set deny policy assignments
      description: |
        Get a list of actual set assignments of the general deny policy.</br>  
        This operation is limited to entitled users of role oid_versicherter.
        
        **Client**:</br>
        no recommendations.

        **Provider**:</br>
        The returned list shall contain a list of all actual set assignments of the general deny policy.</br>

        | Conditions | Status code | Error code | Remarks |
        |------------|-------------|------------|---------|
        | Successful operation | 200 |||
        | Request does not match schema | 400 | malformedRequest ||
        | Requestor not authorized | 403 | invalAuth | no user session with valid ID-Token available |
        | Device registration does not exist | 403 | unregisteredDevice ||
        | Requestor has no valid entitlement | 403 | notEntitled ||
        | Requestor role is not _oid_versicherter_ | 403 | invalidOid ||
        | Health record does not exist (UNKNOWN) or is in state INITIALIZED | 404 | noHealthRecord | |
        | Health record is in state SUSPENDED or INACCESSIBLE| 409 | statusMismatch | (see 'Retry interval') |
        | Any other error | 500 | internalError | (see 'Retry interval') |

         </br>
        | Postconditions                        | Remarks |
        |---------------------------------------|---------|
        | none ||

      responses:
        '200':
          description: Ok. Returns a list of policy assignments
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/DenyPolicyAssignmentResponseType'
              examples:
                getAll:
                  $ref: '#/components/examples/Get_AllPolicyAssignments'
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '409':
          $ref: '#/components/responses/Error409Conflict'
        '500':
          $ref: '#/components/responses/Error500InternalError'

    post:
      tags:
        - ConstraintManagement
      operationId: setDenyPolicyAssignment
      summary: (setDenyPolicyAssignment) set a new deny policy assignment
      description: |
        Set a new assignment for the general deny policy.</br>
        This operation is limited to entitled users of role oid_versicherter.

        **Client**:</br>
        A client shall set assignments for existing resources only.</br>
        A client shall set assignments _folder_ for dynamic folders only (static 
        folders are assigned via _category_ only).</br> 
        A client shall not set assignments _document_ for a restricted category/folder.
        A client shall set assignments for content of the XDS document service only.
        A client shall not set assignments _document_ for static folder "technical".

        **Provider**:</br>
        A new assignment shall use:</br>
        - a _category_ entry addressed by a technical identifier string (e.g. 'vaccination'), or</br>
        - a _folder_ entry addressed by folder.EntryUUID (urn-encoded uuid), or</br>
        - a _document_ entry addressed by an identifier 'uniqueID^^^^urn:gematik:iti:xds:2023:rootDocumentUniqueId' as 
        used in documentEntry.referenceIdList of the document.

        The category "emp" shall not be hidden, neither shall single documents of this category be hidden.
        The static folder ('category') "technical" shall not be hidden, neither shall single documents of this folder be hidden.
        Assignment requests for these categories/folders or documents of such category/folder shall be rejected.

        Each new valid assigment shall be extended by a uuid (assignmentId) for identification
        by the server. This uuid shall be unique in context of deny policies for the health record.

        | Conditions | Status code | Error code | Remarks |
        |------------|-------------|------------|---------|
        | Successful operation | 201 |||
        | Request does not match schema | 400 | malformedRequest ||
        | Requestor not authorized | 403 | invalAuth | no user session with valid ID-Token available |
        | Requestor has no valid entitlement | 403 | notEntitled ||
        | Requestor role is not _oid_versicherter_ | 403 | invalidOid ||
        | Device registration does not exist | 403 | unregisteredDevice ||
        | The addressed _category_ is "emp" or "technical"| 403 | invalidResource ||
        | The addressed _document_ is part of category "emp" or "technical"| 403 | invalidResource ||
        | Health record does not exist (UNKNOWN) or is in state INITIALIZED | 404 | noHealthRecord | |
        | The addressed _document_ or _folder_ does not exist | 404 | noResource ||
        | Health record is in state SUSPENDED or INACCESSIBLE| 409 | statusMismatch | (see 'Retry interval') |
        | The addressed _folder_ is not of type _dynamic_ | 409 | requestMismatch ||
        | The addressed _document_ is part of a restricted category or folder | 409 | requestMismatch ||
        | The addressed _category_ is not part of the XDS Document Service | 409 | requestMismatch ||
        | The assignment does yet exist | 409 | requestMismatch | avoid duplicates ||
        | Any other error | 500 | internalError | (see 'Retry interval') |

         </br>
        | Postconditions                        | Remarks |
        |---------------------------------------|---------|
        | The policy assignment is extended with the assignmentId and stored in SecureDataStorage ||
        | A log-entry for the operation exists | all operation results |
        | The raw-data of the operation is collected and associated to _useragent_ | for any operation result according to gemSpec_PerfUC_B4.x |

      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/DenyPolicyAssignmentType'
            examples:
              GDPolicyAssignmentForCategories:
                $ref: '#/components/examples/Add_category_to_general_deny_policy'
              GDPolicyAssignmentForDocuments:
                $ref: '#/components/examples/Add_document_to_general_deny_policy'
              GDPolicyAssignmentForFolders:
                $ref: '#/components/examples/Add_folder_to_general_deny_policy'
      responses:
        '201':
          description: Created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/DenyPolicyAssignmentResponseType'
              examples:
                GDPolicyAssignmentForCategories:
                  $ref: '#/components/examples/Response_category_to_general_deny_policy'
                GDPolicyAssignmentForDocuments:
                  $ref: '#/components/examples/Response_document_to_general_deny_policy'
                GDPolicyAssignmentForFolders:
                  $ref: '#/components/examples/Response_folder_to_general_deny_policy'
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '409':
          $ref: '#/components/responses/Error409Conflict'
        '500':
          $ref: '#/components/responses/Error500InternalError'



  /epa/xds-document/api/v1/constraints/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/insurantid'
      - $ref: '#/components/parameters/assignmentId'
      - $ref: '#/components/parameters/useragent'
      - $ref: '#/components/parameters/requestid'
    delete:
      tags:
        - ConstraintManagement
      operationId: deleteDenyPolicyAssignment
      summary: (deleteDenyPolicyAssignment) delete a specific deny policy assignment
      description: |
        Delete one existing assignment of the general deny policy.</br>
        This operation is limited to entitled users of role oid_versicherter.

        **Client**:</br>
        no recommendations.

        **Provider**:</br>
        The addressed assignment shall be removed from the general deny policy.

        | Conditions | Status code | Error code | Remarks |
        |------------|-------------|------------|---------|
        | Successful operation | 204 |||
        | Request does not match schema | 400 | malformedRequest ||
        | Requestor not authorized | 403 | invalAuth | no user session with valid ID-Token available |
        | Requestor has no valid entitlement | 403 | notEntitled ||
        | Device registration does not exist | 403 | unregisteredDevice ||
        | Requestor role is not _oid_versicherter_ | 403 | invalidOid ||
        | Health record does not exist (UNKNOWN) or is in state INITIALIZED | 404 | noHealthRecord | |
        | Assignment (_assignmentid_) does not exist | 404 | noResource ||
        | Health record is in state SUSPENDED or INACCESSIBLE| 409 | statusMismatch | (see 'Retry interval') |
        | Any other error | 500 | internalError | (see 'Retry interval') |

         </br>
        | Postconditions                        | Remarks |
        |---------------------------------------|---------|
        | The addressed assignment is removed from the general deny policy ||
        | A log-entry for the operation exists | all operation results |

      responses:
        '204':
          description: OK. Assignment deleted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '409':
          $ref: '#/components/responses/Error409Conflict'
        '500':
          $ref: '#/components/responses/Error500InternalError'
  
  /epa/xds-document/api/v1/constraints/batch-set:
    parameters:
      - $ref: '#/components/parameters/insurantid'
      - $ref: '#/components/parameters/useragent'
      - $ref: '#/components/parameters/requestid'
    post:
      tags:
        - ConstraintManagement
      operationId: batchSetDenyPolicyAssignment
      summary: (batchSetDenyPolicyAssignment) set one or more new deny policy assignment
      description: |
        Set one or more new assignment for the general deny policy.</br>
        This operation is limited to entitled users of role oid_versicherter.

        **Client**:</br>
        A client shall set assignments for existing resources only.</br>
        A client shall set assignments _folder_ for dynamic folders only (static 
        folders are assigned via _category_ only).</br> 
        A client shall not set assignments _document_ for a restricted category/folder.
        A client shall set assignments for content of the XDS document service only.
        A client shall not set assignments _document_ for staticfolder "technical".

        A client may set assignments for several resources in a single request, e.g. to add
        a document and its appendencies or to add a list of categories.  

        **Provider**:</br>
        Each new assignment shall be:</br>
        - a _category_ entry addressed by a technical identifier string (e.g. 'vaccination'), or</br>
        - a _folder_ entry addressed by folder.EntryUUID (urn-encoded uuid), or</br>
        - a _document_ entry addressed by an identifier 'uniqueID^^^^urn:gematik:iti:xds:2023:rootDocumentUniqueId' as 
        used in documentEntry.referenceIdList of the document.
        
        The category "emp" shall not be hidden, neither shall single documents of this category be hidden.
        The static folder (or category) "technical" shall not be hidden, neither shall single documents of this folder be hidden.
        Assignment requests for these categories/folders or documents of such category/folder shall be rejected.

        Each new valid assigment shall be extended by a uuid (assignmentId) for identification
        by the server. This uuid shall be unique in context of deny policies for the health record.

        A request may contain several assignments of the same or of different types at a time. A successful operation 
        result requires all contained assignments to be valid. At least one invalid assignment provided leads to abortion
        of the operation with no assignment provided applied to the general deny policy at all. 

        The operation response shall be: 
        - status code '201' and a list of all requested assignments in case of success
        - status code '422' and a list of the failed requested assignments including an error code (not listed 
        but requested assignments are rated as valid but are not added to the general deny policy).
        - a status code other than '201' or '422' and an indicating error code if the whole request is rejected in general
  

        | Conditions for http status code| Status code | Error code | Remarks |
        |--------------------------------|-------------|------------|---------|
        | Successful operation | 201 |||
        | Request does not match schema | 400 | malformedRequest ||
        | Requestor not authorized | 403 | invalAuth | no user session with valid ID-Token available |
        | Requestor has no valid entitlement | 403 | notEntitled ||
        | Requestor role is not _oid_versicherter_ | 403 | invalidOid ||
        | Device registration does not exist | 403 | unregisteredDevice ||
        | Health record does not exist (UNKNOWN) or is in state INITIALIZED | 404 | noHealthRecord | |
        | Health record is in state SUSPENDED or INACCESSIBLE| 409 | statusMismatch | (see 'Retry interval') |
        | Unsuccessful operation with partial errors| 422 || see _Conditions for response_ table below | 
        | Any other error | 500 | internalError | (see 'Retry interval') |

        <br/>        | Conditions for response error code | Error code | Remarks |
        |------------------------------------|------------|---------|
        | An addressed _document_ is part of category "emp" or "technical"| invalidResource ||
        | An addressed _document_, _category_ or _folder_ does not exist | noResource | for _category_: any category not enumerated |
        | An addressed _folder_ is not of type _dynamic_ | requestMismatch ||
        | An addressed _document_ is part of a restricted category or folder | requestMismatch ||

         </br>
        | Postconditions                        | Remarks |
        |---------------------------------------|---------|
        | The policy assignments are extended with an assignmentId and stored in SecureDataStorage ||
        | A log-entry for the operation exists | all operation results |
        | The raw-data of the operation is collected and associated to _useragent_ | for any operation result according to gemSpec_Perf UC_B4.x |

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object  
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/DenyPolicyAssignmentType' 
                  minItems: 1
                  maxItems: 25
            examples:
              AssignmentsOk1: 
                $ref: '#/components/examples/Add_three_documents'
              AssignmentsOk2: 
                $ref: '#/components/examples/Add_two_categories_and_one_folder'
              AssignmentsFail1: 
                $ref: '#/components/examples/Failed_add_three_documents'
              AssignmentsFail2: 
                $ref: '#/components/examples/Failed_add_two_categories_with_unsupported_id_and_document_in_technical_folder'
      responses:
        '201':
          description: Created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/DenyPolicyAssignmentResponseType'   
                        minItems: 1
              examples:
                ResponseAssignmentsOk1: 
                  $ref: '#/components/examples/Response_add_three_documents'
                ResponseAssignmentsOk2: 
                  $ref: '#/components/examples/Response_add_two_categories_and_one_folder'
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '409':
          $ref: '#/components/responses/Error409Conflict'
        '422':
          description: Unprocessable Entity with error details about the failed requested assignments
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/DenyPolicyAssignmentResponseTypeFail'     
                        minItems: 1
              examples:
                ResponseAssignmentsFail1: 
                  $ref: '#/components/examples/Failed_response_add_three_documents'
                ResponseAssignmentsFail2: 
                  $ref: '#/components/examples/Failed_response_add_two_categories_with_unsupported_id_and_document_in_technical_folder'
        '500':
          $ref: '#/components/responses/Error500InternalError'
  
  /epa/xds-document/api/v1/constraints/batch-delete:
    parameters:
      - $ref: '#/components/parameters/insurantid'
      - $ref: '#/components/parameters/useragent'
      - $ref: '#/components/parameters/requestid'
    post:
      tags:
        - ConstraintManagement
      operationId: batchDeleteDenyPolicyAssignment
      summary: (batchDeleteDenyPolicyAssignment) delete one or more deny policy assignment
      description: |
        Delete one or more existing assignment of the general deny policy.</br>
        This operation is limited to entitled users of role oid_versicherter.

        **Client**:</br>
        no recommendations.

        **Provider**:</br>
        All addressed assignments shall be removed from the general deny policy.

        A successful operation result requires all provided assignments to be valid (i.e. assignmentid exists). 
        At least one invalid assignment provided leads to abortion of the operation with non of the assignments deleted. 

        The operation response is: 
        - Status code '204' if all addressed assignments are deleted
        - Status code '422' and a list of the failed requested assignments including an error code (not listed 
        but requested assignments are acceptable for deletion but not yet deleted)
        - Status code other than '204' or '422' and an indicating error code if the whole request is rejected in general.       

        | Conditions | Status code | Error code | Remarks |
        |------------|-------------|------------|---------|
        | Successful operation | 204 |||
        | Request does not match schema | 400 | malformedRequest ||
        | Requestor not authorized | 403 | invalAuth | no user session with valid ID-Token available |
        | Requestor has no valid entitlement | 403 | notEntitled ||
        | Device registration does not exist | 403 | unregisteredDevice ||
        | Requestor role is not _oid_versicherter_ | 403 | invalidOid ||
        | Health record does not exist (UNKNOWN) or is in state INITIALIZED | 404 | noHealthRecord | |
        | Health record is in state SUSPENDED or INACCESSIBLE| 409 | statusMismatch | (see 'Retry interval') |
        | Unsuccessful operation with partial errors| 422 || see _Conditions for response_ table below | 
        | Any other error | 500 | internalError | (see 'Retry interval') |

        <br/>
        | Conditions for response error code | Error code | Remarks |
        |------------------------------------|------------|---------|
        | Assignment (_assignmentid_) does not exist | noResource ||

         </br>
        | Postconditions                        | Remarks |
        |---------------------------------------|---------|
        | The addressed assignments are removed from the general deny policy | successful operation only |
        | A log-entry for the operation exists | all operation results |

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object  
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/DenyPolicyAssignmentDeleteType' 
                  minItems: 1
                  maxItems: 25
            examples:
              DeleteOk1: 
                $ref: '#/components/examples/Delete_three_documents'

      responses:
        '422':
          description: Unprocessable Entity with error details about the failed requested deletions
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                          - $ref: '#/components/schemas/DenyPolicyAssignmentDeleteResponseTypeFail'      
                        minItems: 1
              examples:
                DeleteFail1: 
                  $ref: '#/components/examples/Failed_response_delete_three_documents'

        '204':
          description: OK. Assignment deleted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/requestid'
        '400':
          $ref: '#/components/responses/Error400BadRequest'
        '403':
          $ref: '#/components/responses/Error403Forbidden'
        '404':
          $ref: '#/components/responses/Error404NotFound'
        '409':
          $ref: '#/components/responses/Error409Conflict'
        '500':
          $ref: '#/components/responses/Error500InternalError'

components:
  headers:
    requestid:
      description: Request identifier as provided by the client.
      schema:
       $ref: '#/components/schemas/RequestIdType'
  responses:
    Error400BadRequest:
      description: Bad Request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: malformedRequest
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error403Forbidden:
      description: Forbidden.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: notEntitled
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error404NotFound:
      description: Not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: noHealthRecord
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error409Conflict:
      description: Conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          examples:
            statusMismatch:
              value:
                errorCode: statusMismatch
            requestMismatch:
              value:
                errorCode: requestMismatch
          schema:
            $ref: '#/components/schemas/ErrorType'
    Error500InternalError:
      description: Internal Server Error
      headers:
        X-Request-ID:
          $ref: '#/components/headers/requestid'
      content:
        application/json:
          example:
            errorCode: internalError
          schema:
            $ref: '#/components/schemas/ErrorType'

  parameters:
    insurantid:
      name: x-insurantid
      in: header
      description: Health Record Identifier.
      required: true
      schema:
        $ref: '#/components/schemas/InsurantIdType'
    useragent:
      name: x-useragent
      in: header
      description: user agent information
      required: true
      schema:
        $ref: '#/components/schemas/UserAgentType'
    requestid:
      name: X-Request-ID
      in: header
      description: request identifier
      schema:
        $ref: '#/components/schemas/RequestIdType'
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AssignmentIdType'
  schemas:
    AssignmentIdType:
      description: Server-assigned unique uuid of a particular deny policy assignment
      type: string
      format: uuid
      example: fa2bc929-f6c9-419f-ae75-cea040927651
    UuidType:
      description: An urn-encoded UUID
      type: string
      example: urn:uuid:4fa70820-2384-4001-80a9-7bbd5e085efb
    RootDocumentIdType:
      description: |
        The rootDocumentUniqueId, a CXi style identifier with schema 'uniqueID^^^^urn:gematik:iti:xds:2023:rootDocumentUniqueId' with symbolic UUID as uniqueId
      type: string
      example: urn:uuid:4fa70820-2384-4001-80a9-7bbd5e085efb^^^^urn:gematik:iti:xds:2023:rootDocumentUniqueId
    CategoryIdType:
      description: A technical identifier of a category
      type: string
      enum:
        - reports
        - emergency
        - eab
        - dental
        - child
        - childsrecord
        - pregnancy_childbirth
        - vaccination
        - patient
        - receipt
        - diga
        - care
        - eau
        - rehab
        - transcripts
        - other
      example: emergency
    ErrorResponseType:
      description: Error condition specifier
      type: string
    DenyPolicyAssignmentDeleteType:
      description: Basic type for deny policy assignment deletion.
      type: object
      properties:
        assignmentId:
          allOf:
            - $ref: '#/components/schemas/AssignmentIdType'
          description: unique identifier of a particular deny policy assignment
    DenyPolicyAssignmentDeleteResponseTypeFail:
      description: Basic type for a deny policy assignment deletion error response.
      allOf:
        - type: object
          properties:
            errorCode:
              allOf:
                - $ref: '#/components/schemas/ErrorResponseType'
        - type: object
          properties:
            assignmentId:
              allOf:
                - $ref: '#/components/schemas/AssignmentIdType'
    DenyPolicyAssignmentType:
      description: Basic type for deny policy assignments.
      oneOf:
        - $ref: '#/components/schemas/GDPolicyAssignmentForDocumentType'
        - $ref: '#/components/schemas/GDPolicyAssignmentForFolderType'
        - $ref: '#/components/schemas/GDPolicyAssignmentForCategoryType'
    DenyPolicyAssignmentResponseType:
      description: Basic type for a deny policy assignment response.
      allOf:
        - type: object
          properties:
            assignmentId:
              allOf:
                - $ref: '#/components/schemas/AssignmentIdType'
        - $ref: '#/components/schemas/DenyPolicyAssignmentType'
    DenyPolicyAssignmentResponseTypeFail:
      description: Basic type for a deny policy assignment error response.
      allOf:
        - type: object
          properties:
            errorCode:
              allOf:
                - $ref: '#/components/schemas/ErrorResponseType'
        - $ref: '#/components/schemas/DenyPolicyAssignmentType'
    GDPolicyAssignmentForCategoryType:
      description: Global deny policy assigment for a single category (static folder).
      type: object
      properties:
        for:
          type: string
          enum:
            - category
        parameters:
          type: object
          required:
            - categoryId
          properties:
            categoryId:
              allOf:
                - $ref: '#/components/schemas/CategoryIdType'
              description: technical identifier of a category
    GDPolicyAssignmentForDocumentType:
      description: Global deny policy assigment for a single document.
      type: object
      properties:
        for:
          type: string
          enum:
            - document
        parameters:
          type: object
          required:
            - rootDocumentId
          properties:
            rootDocumentId:
              allOf:
                - $ref: '#/components/schemas/RootDocumentIdType'
              description: unique root document identifier of a document
    GDPolicyAssignmentForFolderType:
      description: Global deny policy assigment for a single (dynamic) folder.
      type: object
      properties:
        for:
          type: string
          enum:
            - folder
        parameters:
          type: object
          required:
            - folderUUID
          properties:
            folderUUID:
              allOf:
                - $ref: '#/components/schemas/UuidType'
              description: Folder.entryUUID
    UserAgentType:
      description: "Information about client software with: ClientId (1 to 20 characters) + / + VersionNumber (1 to 15 characters)."
      type: string
      pattern: '^[a-zA-Z0-9\-]{1,20}\/[a-zA-Z0-9\-\.]{1,15}$'
      example: CLIENTID1234567890AB/2.1.12-45
    RequestIdType:
      type: string
      format: uuid
      description: "Unique identifier of the request"
      example: "f4411e89-2eca-405c-88a1-7ee20b9b6e3c"
    InsurantIdType:
      type: string
      description: |-
        The health record identifier. 
        For today the record identifier equals the insurant id (kvnr).
      pattern: '^[A-Z]{1}\d{9}$'
      example: Z123456789
    ErrorType:
      description: Error object with additional information about the occurred error
      type: object
      properties:
        errorCode:
          description: Error condition specifier
          type: string
        errorDetail:
          description: Additional details regarding the error condition (if applicable)
          type: string
      required:
        - errorCode

